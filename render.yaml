# Deploys the live timing relay (server/client.js) on Render.
# This lets the page published on GitHub Pages read the data from
# any device, without depending on a computer at home being on:
# Render serves the WebSocket over wss://, which is the only kind an https
# site can open.
#
# Usage: New > Blueprint on Render, pointing to this repo. The resulting URL
# (https://<something>.onrender.com) is the one that goes in RELAY_URL, at the top
# of js/live.js.
services:
  - type: web
    name: f1-hub-relay
    runtime: node
    plan: free
    # No rootDir: the relay reads data/ (the season file, for the current GP)
    # and js/shared/merge.js (the same merge the Live page uses), so it gets
    # the whole repo. Render documents that a rootDir hides everything outside it.
    buildCommand: npm ci --prefix server
    startCommand: node server/client.js
    # Redeploy only when the relay's own code changes. Without this, every
    # auto-fill commit to data/ (every 30 min on race weekends) would restart it.
    buildFilter:
      paths:
        - server/**
        - js/shared/merge.js
    healthCheckPath: /health
