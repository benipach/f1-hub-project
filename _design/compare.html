<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1 Hub — Comparar direcciones</title>
<style>
  :root { --bg:#0b0b10; --panel:#15151d; --line:#2a2a36; --text:#e6e6ea; --dim:#9a9aa6; --red:#e10600; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 system-ui, sans-serif; }
  header { position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap; gap:16px; align-items:center;
           padding:12px 20px; background:rgba(11,11,16,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
  h1 { font-size:15px; margin:0 12px 0 0; font-weight:700; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; }
  .seg button { background:none; border:0; color:var(--dim); padding:7px 14px; font:inherit; cursor:pointer; }
  .seg button[aria-pressed="true"] { background:var(--red); color:#fff; }
  main { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:20px; padding:20px; }
  main.mobile { grid-template-columns:repeat(5, minmax(0,1fr)); }
  figure { margin:0; background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  figcaption { display:flex; justify-content:space-between; align-items:baseline; gap:8px; padding:10px 14px; border-bottom:1px solid var(--line); }
  figcaption b { font-size:14px; }
  figcaption span { color:var(--dim); font-size:12px; }
  figcaption a { color:var(--text); font-size:12px; white-space:nowrap; }
  .frame { position:relative; overflow:hidden; }
  .frame iframe { position:absolute; top:0; left:0; border:0; transform-origin:0 0; background:#fff; }
  @media (max-width: 900px) { main, main.mobile { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>Index redesign — 5 directions</h1>
  <div class="seg" id="state">
    <button data-v="upcoming" aria-pressed="true">Upcoming</button>
    <button data-v="live" aria-pressed="false">Live</button>
    <button data-v="result" aria-pressed="false">Result</button>
  </div>
  <div class="seg" id="device">
    <button data-v="desktop" aria-pressed="true">Desktop 1440</button>
    <button data-v="mobile" aria-pressed="false">Mobile 375</button>
  </div>
</header>
<main id="grid"></main>
<script>
  const DIRS = [
    ['a-telemetry', 'A · Pit wall / telemetry', 'Dense data, mono numerals, hairlines'],
    ['b-editorial', 'B · Editorial / magazine', 'Paper base, serif headlines, photography'],
    ['c-broadcast', 'C · Broadcast / TV', 'Slanted panels, team colors, timing towers'],
    ['d-poster',    'D · Race poster / Swiss', 'Huge type, flat color per state, track shapes'],
    ['e-hybrid',    'E · Hybrid: editorial + broadcast', 'Magazine between races, broadcast when live'],
  ];
  const SIZES = { desktop: [1440, 900], mobile: [375, 812] };
  let state = new URLSearchParams(location.search).get('state') || 'upcoming';
  let device = 'desktop';
  const grid = document.getElementById('grid');

  function render() {
    const [w, h] = SIZES[device];
    grid.className = device;
    grid.innerHTML = DIRS.map(([dir, name, sub]) => `
      <figure>
        <figcaption><div><b>${name}</b> <span>${sub}</span></div>
          <a href="./${dir}/index.html?state=${state}" target="_blank">Open full ↗</a></figcaption>
        <div class="frame" data-w="${w}" data-h="${h}">
          <iframe src="./${dir}/index.html?state=${state}" width="${w}" height="${h}" loading="lazy" title="${name}"></iframe>
        </div>
      </figure>`).join('');
    fit();
  }
  function fit() {
    document.querySelectorAll('.frame').forEach(f => {
      const w = +f.dataset.w, h = +f.dataset.h, s = f.clientWidth / w;
      f.style.height = `${h * s}px`;
      f.querySelector('iframe').style.transform = `scale(${s})`;
    });
  }
  for (const [id, set] of [['state', v => state = v], ['device', v => device = v]]) {
    document.getElementById(id).addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      set(b.dataset.v);
      e.currentTarget.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
      render();
    });
  }
  document.querySelectorAll('#state button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === state));
  addEventListener('resize', fit);
  render();
</script>
</body>
</html>
