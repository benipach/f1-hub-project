<!DOCTYPE html>
<html lang="en" translate="no">
<head>

    <script>

      function gtag(){dataLayer.push(arguments);}

      gtag('config', 'G-V7JKWRTE0S');

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Hub | Archive</title>
    <link rel="icon" href="img/icon.png">
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/archive.css">
    <script src="./js/twemoji.js"></script>
    <!-- One card per season (data/seasons-index.json). The details live
         in results.html?season=YYYY and championship.html?season=YYYY. -->
    <script src="./js/shared/api.js" defer></script>
    <script src="./js/archive.js" defer></script>
    <script src="./js/navbar.js" defer></script>
    <script src="./js/footer.js" defer></script>
</head>
<body>

<header class="navbar">
    <a href="./index.html" class="logo-container">
        <img src="img/logo.png" alt="F1 Hub Logo" class="nav-logo">
    </a>

    <button class="hamburger" id="hamburger-btn" aria-label="Open Menu">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
    </button>

    <nav>
        <ul id="nav-menu" class="nav-menu">
            <li><a href="./index.html#calendar">Calendar</a></li>
            <li><a href="./championship.html">Championship</a></li>
            <li><a href="./results.html">Results</a></li>
            <li><a href="./drivers.html">Drivers</a></li>
            <li><a href="./teams.html">Teams</a></li>
            <li><a href="./live.html">Live</a></li>
            <li><a href="./archive.html">Archive</a></li>
        </ul>
    </nav>
</header>

<main>

    <!-- ── HERO: title + archive numbers (filled in by archive.js) ── -->
    <section class="archive-hero">
        <div class="archive-hero-glow" aria-hidden="true"></div>
        <img src="./img/trophies/wdc.png" alt="" class="archive-hero-trophy" aria-hidden="true">
        <div class="archive-hero-content">
            <p class="archive-hero-kicker" id="archive-kicker">Formula 1</p>
            <h1>Archive</h1>
            <div class="archive-hero-meta" id="archive-meta"></div>
        </div>
    </section>

    <!-- ── SEASONS: one section per decade, one card per year (archive.js) ── -->
    <div class="archive-decades" id="archive-seasons"></div>

    <p class="archive-empty" id="archive-empty" hidden>No seasons available.</p>

</main>

<footer class="footer" data-root="."></footer>

</body>
</html>
