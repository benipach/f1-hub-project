<body>

<header class="navbar">
        <a href="#" class="logo-container">
            <img src="img/logo.png" alt="F1 Hub Logo" class="nav-logo">
        </a>

        <button class="hamburger" id="hamburger-btn" aria-label="Open Menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>

        <nav>
            <ul id="nav-menu" class="nav-menu">
                <li><a href="#calendar">Calendar</a></li>
                <li><a href="./results.html">Results</a></li>
                <li><a href="./drivers.html">Drivers</a></li>
                <li><a href="./teams.html">Teams</a></li>
                <li><a href="./live.html">Live</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main -->
    <main>

        <!-- Section race hero -->
        <section class="race-hero">
            
            <img src="img/hero-bg.jpg" id="hero-image" class="race-hero-bg">

            <div class="race-hero-left">
                <canvas id="hero-city-canvas" class="hero-city-canvas" aria-hidden="true"></canvas>
                <span id="hero-city-fallback" class="hero-city-fallback">Loading...</span>
            </div>

            <div class="race-hero-right">
                <div class="hero-title-row">
                    <h1 class="hero-gp-name" id="hero-gp-name">–</h1>
                    <span class="hero-gp-flag" id="hero-gp-flag" aria-hidden="true"></span>
                </div>
                <p class="hero-underline" id="hero-circuit-label">–</p>

                <div class="hero-divider"></div>
                <p class="hero-schedule-label">Race Weekend</p>

                <div class="hero-schedule" id="hero-schedule">
                    <div class="hero-schedule-days" id="hero-schedule-days">
                        <!-- Populated by JS -->
                    </div>

                    <a class="hero-circuit-btn" id="hero-circuit-btn" href="#">
                        <span>VIEW CIRCUIT</span>
                        <span class="hero-circuit-btn-arrow">→</span>
                    </a>
                </div>
            </div>
        
        </section>

        <!-- Section race calendar -->

        <section id="calendar" class="race-calendar">

            <div class="calendar-header">
                <h2 class="calendar-title" id="calendar-title">Season Calendar</h2>
            </div>
            <!-- The year in "calendar-title" and the race cards are generated
                 dynamically in index.js from data/latest.json (which
                 points to the most recent season) + season{year}.json.
                 There's no season selector: index.html always shows the
                 latest one available, with no query string or hardcoded year. -->

        </section>
    </main>


    <script>
        (() => {
            const canvas = document.getElementById('hero-city-canvas');
            const fallback = document.getElementById('hero-city-fallback');
            const heroLeft = document.querySelector('.race-hero-left');
            const heroBg = document.getElementById('hero-image');

            if (!canvas || !heroLeft || !heroBg) return;

            const ctx = canvas.getContext('2d');
            const offscreenSupported = typeof OffscreenCanvas !== 'undefined';

            let bgCanvas;
            let blurCanvas;
            let maskCanvas;
            let compCanvas;
            let bgCtx;
            let blurCtx;
            let maskCtx;
            let compCtx;
            let currentText = '';
            let lastWidth = 0;
            let lastHeight = 0;
            const BLUR = 10;
            const TEXT_TINT_OPACITY = 0.67;

            // Set by index.js once the next GP is determined
            const getHeroCity = () => window._heroCity || '';

            const makeCanvas = (w, h) => offscreenSupported
                ? new OffscreenCanvas(w, h)
                : Object.assign(document.createElement('canvas'), { width: w, height: h });

            const setupCanvases = (w, h) => {
                bgCanvas = makeCanvas(w, h);
                blurCanvas = makeCanvas(w, h);
                maskCanvas = makeCanvas(w, h);
                compCanvas = makeCanvas(w, h);

                bgCtx = bgCanvas.getContext('2d');
                blurCtx = blurCanvas.getContext('2d');
                maskCtx = maskCanvas.getContext('2d');
                compCtx = compCanvas.getContext('2d');
            };

            const drawHeroBackgroundCrop = (w, h) => {
                bgCtx.clearRect(0, 0, w, h);

                if (!heroBg.complete || !heroBg.naturalWidth) return;

                const imgW = heroBg.naturalWidth;
                const imgH = heroBg.naturalHeight;
                const heroRect = document.querySelector('.race-hero').getBoundingClientRect();
                const leftRect = heroLeft.getBoundingClientRect();

                const renderedW = heroRect.width;
                const renderedH = heroRect.height;
                const scale = Math.max(renderedW / imgW, renderedH / imgH);
                const scaledW = imgW * scale;
                const scaledH = imgH * scale;
                const offsetX = (renderedW - scaledW) / 2;
                const offsetY = (renderedH - scaledH) / 2;

                const cropX = (leftRect.left - heroRect.left - offsetX) / scale;
                const cropY = (leftRect.top - heroRect.top - offsetY) / scale;
                const cropW = leftRect.width / scale;
                const cropH = leftRect.height / scale;

                bgCtx.drawImage(heroBg, cropX, cropY, cropW, cropH, 0, 0, w, h);
                bgCtx.fillStyle = 'rgba(0, 0, 0, 0.25)';
                bgCtx.fillRect(0, 0, w, h);
            };

            const drawMask = (w, h, text) => {
                maskCtx.clearRect(0, 0, w, h);

                const maxTextWidth = w * 0.8;

                let fontSize = Math.min(h * 0.18, w / Math.max(text.length * 0.56, 4));
                fontSize = Math.max(42, Math.min(fontSize, 150));

                maskCtx.font = `900 ${fontSize}px F1-Black`;
                // No artificial floor here on purpose: a short name like "Baku"
                // can stay big, but "Silverstone" or "Mexico City" must keep
                // shrinking — in steps of 1px near the end — until it actually
                // fits, instead of giving up and overflowing past maxTextWidth.
                while (maskCtx.measureText(text).width > maxTextWidth && fontSize > 12) {
                    fontSize -= fontSize > 40 ? 4 : 1;
                    maskCtx.font = `900 ${fontSize}px F1-Black`;
                }

                maskCtx.textAlign = 'center';
                maskCtx.textBaseline = 'middle';
                maskCtx.fillStyle = 'rgb(10,10,20)';
                maskCtx.fillText(text.toUpperCase(), w / 2, h / 2);
            };

            const draw = () => {
                const rect = heroLeft.getBoundingClientRect();
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                const w = Math.max(1, Math.round(rect.width * dpr));
                const h = Math.max(1, Math.round(rect.height * dpr));
                const text = getHeroCity();

                if (w !== lastWidth || h !== lastHeight) {
                    canvas.width = w;
                    canvas.height = h;
                    canvas.style.width = `${rect.width}px`;
                    canvas.style.height = `${rect.height}px`;
                    setupCanvases(w, h);
                    lastWidth = w;
                    lastHeight = h;
                    currentText = '';
                }

                fallback.textContent = text;
                drawHeroBackgroundCrop(w, h);

                blurCtx.clearRect(0, 0, w, h);
                blurCtx.filter = `blur(${BLUR * dpr}px)`;
                blurCtx.drawImage(bgCanvas, 0, 0);
                blurCtx.filter = 'none';

                if (text !== currentText) {
                    drawMask(w, h, text);
                    currentText = text;
                }

                compCtx.clearRect(0, 0, w, h);
                compCtx.drawImage(maskCanvas, 0, 0);
                compCtx.globalCompositeOperation = 'source-in';
                compCtx.drawImage(blurCanvas, 0, 0);
                compCtx.globalCompositeOperation = 'source-over';

                ctx.clearRect(0, 0, w, h);
                ctx.drawImage(compCanvas, 0, 0);

                ctx.save();
                ctx.globalAlpha = TEXT_TINT_OPACITY;
                ctx.drawImage(maskCanvas, 0, 0);
                ctx.restore();

            };

            const scheduleDraw = () => requestAnimationFrame(draw);

            window.addEventListener('resize', scheduleDraw);
            window.addEventListener('load', scheduleDraw);
            heroBg.addEventListener('load', scheduleDraw);

            const observer = new MutationObserver(scheduleDraw);
            observer.observe(document.querySelector('.race-calendar'), {
                subtree: true,
                attributes: true,
                attributeFilter: ['class']
            });

            scheduleDraw();
        })();
    </script>

    <footer class="footer" data-root="."></footer>

</body>
</html>
