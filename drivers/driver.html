<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-V7JKWRTE0S"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-V7JKWRTE0S');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">F1 Hub | Driver</title>
    <link rel="icon" href="../img/icon.png">
    <link rel="stylesheet" href="../styles/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <script src="../js/shared/gp.js" defer></script>
    <script src="../js/shared/teams.js" defer></script>
    <script src="../js/shared/grid.js" defer></script>
    <script src="../js/driver-reveal.js" defer></script>
    <script src="../js/driver-data.js" defer></script>
    <script src="../js/driver-header.js" defer></script>    <script src="../js/driver-season.js" defer></script>
    <script src="../js/driver-career.js" defer></script>
    <script src="../js/driver-bio.js" defer></script>
    <script src="../js/twemoji.js" defer></script>
    <script src="../js/navbar.js" defer></script>
    <script src="../js/footer.js" defer></script>
    <link rel="stylesheet" href="../styles/driver.css"></head>
<body>

    <header class="navbar">
        <a href="../index.html" class="logo-container">
            <img src="../img/logo.png" alt="F1 Hub Logo" class="nav-logo">
        </a>
        <button class="hamburger" id="hamburger-btn" aria-label="Open menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>
        <nav>
            <ul id="nav-menu" class="nav-menu">
                <li><a href="../index.html#calendar">Calendar</a></li>
                <li><a href="../championship.html">Championship</a></li>
                <li><a href="../results.html">Results</a></li>
                <li><a href="../drivers.html">Drivers</a></li>
                <li><a href="../teams.html">Teams</a></li>
                <li><a href="../live.html">Live</a></li>
                <li><a href="../archive.html">Archive</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- Hero populated from real data by js/driver-header.js. -->
        <section class="driver-hero" id="driverHero"></section>

        <div class="driver-content">

            <h2 class="section-title">Driver info</h2>

            <!-- Profile card populated from real data by js/driver-header.js:
                 drivers.json + careers.json + countries.json. -->
            <div class="driver-info" id="driverInfo"></div>

            <h2 class="section-title">2026 Season stats</h2>

            <!-- The current season is told as a trajectory, not as a table:
                 where they stand today, how they've been performing race by race, and
                 only then the round-by-round detail. -->
            <div class="season-2026" id="season2026">

                <div class="season-band" id="seasonBand"></div>

                <div class="season-form">
                    <div class="season-form-head">
                        <h3 class="season-form-title">Form curve</h3>
                        <div class="season-form-legend">
                            <span class="season-form-legend-item is-race">Race finish</span>
                            <span class="season-form-legend-item is-grid">Grid slot</span>
                        </div>
                    </div>
                    <p class="season-racecraft-badge" id="seasonRacecraftBadge" hidden></p>
                    <div class="season-form-canvas">
                        <canvas id="seasonFormChart"></canvas>
                    </div>
                    <p class="season-form-note" id="seasonFormNote"></p>
                </div>

                <div class="season-table-wrap">
                    <table class="season-table">
                        <thead>
                            <tr>
                                <th scope="col" class="season-col-round">Round</th>
                                <th scope="col">Grand Prix</th>
                                <th scope="col" class="is-center">Grid &rarr; Finish</th>
                                <th scope="col" class="is-center">+/&minus;</th>
                                <th scope="col" class="is-right"><span class="season-th-full">Points</span><span class="season-th-abbr">Pts</span></th>
                            </tr>
                        </thead>
                        <tbody id="seasonRounds"></tbody>
                    </table>
                </div>

            </div>

            <h2 class="section-title">Career stats</h2>

            <!-- Each figure comes with its ranking among the dataset's 120 drivers, and
                 the table below shows where it falls against the rest. A number without
                 a reference doesn't say whether it's a lot or a little. -->
            <div class="driver-career" id="driverCareer">

                <div class="career-crown" id="careerCrown"></div>

                <div class="career-standing" id="careerStanding"></div>

                <div class="career-board-wrap">
                    <div class="career-board-head">
                        <h3 class="career-board-title">All-time standing</h3>
                        <div class="career-board-tabs">
                            <button type="button" class="career-board-tab" data-cat="wins">Wins</button>
                            <button type="button" class="career-board-tab" data-cat="podiums">Podiums</button>
                            <button type="button" class="career-board-tab" data-cat="poles">Poles</button>
                            <button type="button" class="career-board-tab" data-cat="points">Points</button>
                            <button type="button" class="career-board-tab" data-cat="fastestLaps">Fastest laps</button>
                            <button type="button" class="career-board-tab" data-cat="races">Races</button>
                        </div>
                    </div>
                    <ol class="career-board" id="careerBoard"></ol>
                    <p class="career-note" id="careerNote"></p>
                </div>

            </div>

            <h2 class="section-title">Career journey</h2>

            <!-- The journey is told team by team: each era painted in the team's
                 real color, and inside it the milestones derived from the results
                 (debut, first points, first podium, first win, first
                 pole). Built automatically from data/careers.json. -->
            <div class="driver-bio" id="driverBio"></div>

        </div>
    </main>

    <footer class="footer" data-root=".."></footer>

</body>
</html>
