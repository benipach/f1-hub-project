<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-V7JKWRTE0S"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-V7JKWRTE0S');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Hub | Championship</title>
    <link rel="icon" href="img/icon.png">
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/championship.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <script src="./js/shared/api.js" defer></script>
    <script src="./js/shared/gp.js" defer></script>
    <script src="./js/shared/teams.js" defer></script>
    <script src="./js/championship.js" defer></script>
    <script src="./js/twemoji.js" defer></script>
    <script src="./js/navbar.js" defer></script>
    <script src="./js/footer.js" defer></script>
</head>
<body>

<header class="navbar">
        <a href="./index.html" class="logo-container">
            <img src="img/logo.png" alt="F1 Hub Logo" class="nav-logo">
        </a>

        <button class="hamburger" id="hamburger-btn" aria-label="Open Menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>

        <nav>
            <ul id="nav-menu" class="nav-menu">
                <li><a href="./index.html#calendar">Calendar</a></li>
                <li><a href="#">Championship</a></li>
                <li><a href="./results.html">Results</a></li>
                <li><a href="./drivers.html">Drivers</a></li>
                <li><a href="./teams.html">Teams</a></li>
                <li><a href="./live.html">Live</a></li>
                <li><a href="./archive.html">Archive</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- Header: title + season selector. The year goes in the URL
             (?season=2019); without a parameter the current season opens. -->
        <div class="champ-header">
            <div class="champ-title-row">
                <h1>Championship</h1>
                <div class="season-select-wrap">
                    <label class="season-select-label" for="champ-season-select">Season</label>
                    <select id="champ-season-select" class="season-select" aria-label="Season"></select>
                </div>
            </div>
            <p id="champHeaderSub">Drivers &amp; Teams Standings</p>
        </div>

        <!-- Chart + table per tab, populated by js/championship.js from
             data/seasons/season2026.json. The chart and the table share the
             focus: tapping a line highlights its row, and vice versa. -->
        <div id="championship">

            <div class="tab-bar champ-tab-bar">
                <button class="tab-btn active" data-tab="drivers">Drivers</button>
                <button class="tab-btn" data-tab="constructors">Teams</button>
            </div>

            <div class="champ-content">

            <!-- ── DRIVERS ── -->
            <div id="tab-drivers" class="tab-panel active">

                <h2 class="section-title">Season progress</h2>

                <div class="champ-form">
                    <div class="champ-form-head">
                        <h3 class="champ-form-title">Points curve</h3>
                        <div class="champ-form-tools">
                            <div class="champ-form-legend">
                                <span class="champ-form-legend-item is-lead">First driver</span>
                                <span class="champ-form-legend-item is-teammate">Team mate</span>
                            </div>
                            <button type="button" class="champ-compare-toggle" aria-pressed="false">
                                <span class="champ-compare-toggle-icon" aria-hidden="true"></span>Compare
                            </button>
                        </div>
                    </div>
                    <!-- Two slots that open/close with an animation: the focused
                         driver's band and the comparison tray (A vs B). -->
                    <div class="champ-form-reveal" data-reveal="badge">
                        <div class="champ-form-reveal-inner"><p class="champ-form-badge"></p></div>
                    </div>
                    <div class="champ-form-reveal" data-reveal="compare">
                        <div class="champ-form-reveal-inner"><div class="champ-compare"></div></div>
                    </div>
                    <div class="champ-form-canvas">
                        <canvas></canvas>
                    </div>
                    <p class="champ-form-note"></p>
                </div>

                <h2 class="section-title">Drivers standings</h2>
                <div class="standings-table-wrap"></div>
            </div>

            <!-- ── CONSTRUCTORS ── -->
            <div id="tab-constructors" class="tab-panel">

                <h2 class="section-title">Season progress</h2>

                <div class="champ-form">
                    <div class="champ-form-head">
                        <h3 class="champ-form-title">Points curve</h3>
                        <div class="champ-form-tools">
                            <button type="button" class="champ-compare-toggle" aria-pressed="false">
                                <span class="champ-compare-toggle-icon" aria-hidden="true"></span>Compare
                            </button>
                        </div>
                    </div>
                    <div class="champ-form-reveal" data-reveal="badge">
                        <div class="champ-form-reveal-inner"><p class="champ-form-badge"></p></div>
                    </div>
                    <div class="champ-form-reveal" data-reveal="compare">
                        <div class="champ-form-reveal-inner"><div class="champ-compare"></div></div>
                    </div>
                    <div class="champ-form-canvas">
                        <canvas></canvas>
                    </div>
                    <p class="champ-form-note"></p>
                </div>

                <h2 class="section-title">Teams standings</h2>
                <div class="standings-table-wrap"></div>
            </div>

            </div>
        </div>
    </main>

    <footer class="footer" data-root="."></footer>
</body>
</html>
