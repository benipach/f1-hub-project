name: Auto fill F1 sessions

on:
  schedule:
    # Every 30 min from Friday to Monday. Monday is included on purpose: a
    # race that ends on Sunday night (or that OpenF1 publishes late) gets
    # a whole extra day to come in, instead of waiting until Friday.
    - cron: "0,30 * * * 5,6,0,1"
  workflow_dispatch:
    inputs:
      force_weather:
        description: "Backfill: re-request weather even if it already exists (e.g. to add wind_direction to old sessions)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  # The season file lives in data/seasons/ since the historical years were
  # added. This path used to be hardcoded in three separate steps and was
  # left pointing to data/season2026.json, which no longer exists: the
  # check crashed, the whole job failed and no race got loaded.
  SEASON_FILE: data/seasons/season2026.json

jobs:
  update-season:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check if there is pending work
        id: check
        run: |
          if [ "${{ github.event.inputs.force_weather }}" = "true" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            node -e "
              const fs = require('node:fs');
              const path = process.env.SEASON_FILE;
              if (!fs.existsSync(path)) {
                console.error(path + ' does not exist: check env.SEASON_FILE in this workflow.');
                process.exit(1);
              }
              const data = JSON.parse(fs.readFileSync(path, 'utf8'));
              const now = Date.now();
              const grace = 45 * 60 * 1000; // 45 min after endDate, gives OpenF1 time to publish
              const isEmptyWeather = (w) => w === null || w === undefined || (typeof w === 'object' && Object.keys(w).length === 0);
              const shouldRun = Object.values(data).some(gp =>
                // A cancelled GP will never have results: if it isn't
                // excluded, the job fires every half hour to do nothing.
                gp && !gp.cancelled && typeof gp.sessions === 'object' && Object.values(gp.sessions).some(s => {
                  if (!s || !s.endDate) return false;
                  const ended = new Date(s.endDate).getTime() + grace <= now;
                  if (!ended) return false;
                  const missingResults = !Array.isArray(s.results) || s.results.length === 0;
                  const missingWeather = isEmptyWeather(s.weather);
                  return missingResults || missingWeather;
                })
              );
              console.log('should_run=' + shouldRun);
            " >> "$GITHUB_OUTPUT"
          fi

      - name: Run OpenF1 auto fill
        if: steps.check.outputs.should_run == 'true'
        run: |
          FLAGS="$SEASON_FILE --year=2026 --once --weather --no-backup --skip=bahrain-gp,saudi-arabian-gp"
          if [ "${{ github.event.inputs.force_weather }}" = "true" ]; then
            FLAGS="$FLAGS --force-weather"
          fi
          node auto-fill-missing.js $FLAGS

      # careers.json is precomputed from all the season files: if new results
      # are loaded and it isn't regenerated, the driver profiles and the all-time
      # rankings keep showing the numbers from the previous race.
      - name: Rebuild careers.json
        if: steps.check.outputs.should_run == 'true'
        run: node scripts/build-careers.js

      # seasons-index.json is precomputed from the season files too: races
      # run, which sessions have results and who leads each season, for the
      # year selector and the season cards on the Results page. It used to be
      # left out of this job and fell weeks behind the 2026 results.
      - name: Rebuild seasons-index.json
        if: steps.check.outputs.should_run == 'true'
        run: node scripts/build-seasons-index.js

      - name: Commit changes
        if: steps.check.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add "$SEASON_FILE" data/careers.json data/seasons-index.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Auto update F1 session data"
          # There may have been other pushes between the checkout and this point.
          git pull --rebase
          git push
