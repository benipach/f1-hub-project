name: Auto fill F1 sessions

on:
  schedule:
    # Every 30 min from Friday to Monday. Monday is included on purpose: a
    # race that ends on Sunday night (or that OpenF1 publishes late) gets
    # a whole extra day to come in, instead of waiting until Friday.
    - cron: "0,30 * * * 5,6,0,1"
  workflow_dispatch:
    inputs:
      force_weather:
        description: "Backfill: re-request weather even if it already exists (e.g. to add wind_direction to old sessions)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  update-season:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The season is whatever data/latest.json points to (moving to a new
      # year is updating that file and adding the season file). The script
      # decides itself whether there's anything to do: with nothing pending
      # it ends without asking OpenF1 anything (see scripts/auto-fill.ts).
      - name: Run OpenF1 auto fill
        run: node scripts/auto-fill.ts ${{ github.event.inputs.force_weather == 'true' && '--force-weather' || '' }}

      # careers.json and seasons-index.json are precomputed from the season
      # files (driver profiles, all-time rankings, the Results page's year
      # selector): when a season changes they're rebuilt with it, or the
      # site keeps showing the numbers from the previous race.
      - name: Rebuild the indexes and commit
        run: |
          git diff --quiet data/seasons && echo "No changes to commit" && exit 0
          node scripts/build-careers.ts
          node scripts/build-seasons-index.ts
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/seasons data/careers.json data/seasons-index.json
          git commit -m "Auto update F1 session data"
          # There may have been other pushes between the checkout and this point.
          git pull --rebase
          git push
