name: Build and deploy site

on:
  push:
    branches: [main, next]
  # The auto-fill workflow commits new results with GITHUB_TOKEN, and GitHub
  # doesn't start other workflows from pushes made with that token. Without
  # this trigger, new results would land in data/ and never get published.
  workflow_run:
    workflows: ["Auto fill F1 sessions"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time, and never cancel a deploy halfway through.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.plan.outputs.deploy }}
    steps:
      # On workflow_run the default checkout is the commit the auto-fill
      # started from, not the one it pushed: take the tip of main instead.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}

      # Every branch is built and checked; only main is published. The
      # auto-fill runs every 30 min from Friday to Monday and almost always
      # finds nothing to do: it only commits when it loaded something, so
      # main moving past the commit it started from is the signal to publish.
      - name: Decide what to do
        id: plan
        run: |
          build=true
          deploy=false
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            if [ "$(git rev-parse HEAD)" = "${{ github.event.workflow_run.head_sha }}" ]; then
              echo "The auto-fill committed nothing: nothing to publish."
              build=false
            else
              deploy=true
            fi
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            deploy=true
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        if: steps.plan.outputs.build == 'true'
        with:
          node-version: 24
          cache: npm

      - if: steps.plan.outputs.build == 'true'
        run: npm ci

      - name: Type check
        if: steps.plan.outputs.build == 'true'
        run: npm run check

      # Includes checking every file in data/ against its schema, so a
      # data commit that breaks the contract doesn't get published.
      - name: Test
        if: steps.plan.outputs.build == 'true'
        run: npm test

      - name: Build
        if: steps.plan.outputs.build == 'true'
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: 1

      - uses: actions/upload-pages-artifact@v5
        if: steps.plan.outputs.deploy == 'true'
        with:
          path: site/dist

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
